<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>版本检查</title>
<style>body{font-family:sans-serif;padding:20px;color:#1F2933;background:#F6F8F3}
h2{color:#0B4F4A}
.ver-box{background:#FFFFFF;padding:20px;border-radius:14px;margin:20px 0;border:1px solid #D7DED8}
.ok{color:#16A34A;font-weight:bold}
.btn{background:#0F766E;color:#fff;border:none;padding:12px 32px;font-size:16px;border-radius:12px;margin-top:16px}
</style></head>
<body>
<h2>版本检查</h2>
<div class="ver-box">
<p>当前版本：v1.0</p>
<p>最新版本：<span class="ok">v1.0 (已是最新)</span></p>
</div>
<p>检查时间：<span id="t"></span></p>
<script>document.getElementById("t").textContent=new Date().toLocaleString("zh-CN")</script>
<button class="btn" onclick="window.close()">确定</button>
</body></html>
